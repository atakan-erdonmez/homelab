---
- name: Deploy Prometheus on svc01
  hosts: svc01
  become: true
  vars:
    prometheus_dir: /opt/services/prometheus
    prometheus_data_dir: "{{ prometheus_dir }}/data"

  tasks:
    - name: Ensure Prometheus directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ prometheus_dir }}"
        - "{{ prometheus_data_dir }}"

    - name: Deploy compose file
      ansible.builtin.copy:
        src: compose.yaml
        dest: "{{ prometheus_dir }}/compose.yaml"
        mode: "0644"

    - name: Deploy prometheus.yaml
      ansible.builtin.template:
        src: prometheus.yaml.j2
        dest: "{{ prometheus_dir }}/prometheus.yaml"
        mode: "0644"

    - name: Ensure Prometheus is running
      community.docker.docker_compose_v2:
        project_src: "{{ prometheus_dir }}"
        state: present
