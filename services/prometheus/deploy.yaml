---
- name: Deploy Prometheus on svc01
  hosts: svc01
  become: true
  vars:
    homepage_dir: /opt/services/prometheus
    homepage_config_dir: "{{ homepage_dir }}/data"

  tasks:
    - name: Ensure Prometheus directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ homepage_dir }}"
        - "{{ homepage_config_dir }}"

    - name: Deploy compose file
      ansible.builtin.copy:
        src: compose.yaml
        dest: "{{ homepage_dir }}/compose.yaml"
        mode: "0644"

    - name: Deploy prometheus.yaml
      ansible.builtin.template:
        src: prometheus.yaml
        dest: "{{ homepage_config_dir }}/prometheus.yaml"
        mode: "0644"

    - name: Ensure Prometheus is running
      community.docker.docker_compose_v2:
        project_src: "{{ homepage_dir }}"
        state: present
