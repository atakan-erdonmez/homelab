---
- name: Deploy Homepage on svc01
  hosts: svc01
  become: true
  vars:
    homepage_dir: /opt/services/homepage
    homepage_config_dir: "{{ homepage_dir }}/config"

  tasks:
    - name: Ensure Homepage directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ homepage_dir }}"
        - "{{ homepage_config_dir }}"

    - name: Deploy compose file
      ansible.builtin.copy:
        src: compose.yaml
        dest: "{{ homepage_dir }}/compose.yaml"
        mode: "0644"

    - name: Deploy services.yaml
      ansible.builtin.copy:
        src: files/services.yaml
        dest: "{{ homepage_config_dir }}/services.yaml"
        mode: "0644"

    - name: Ensure Homepage is running
      community.docker.docker_compose_v2:
        project_src: "{{ homepage_dir }}"
        state: present
