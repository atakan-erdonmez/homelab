services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - 3000:3000
    volumes:
      - /opt/services/homepage/config:/app/config
    # - /var/run/docker.sock:/var/run/docker.sock:ro # Optional: Required for Docker integration/stats
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "*" # Replace * with your domain/IP for stricter host validation
    restart: unless-stopped
