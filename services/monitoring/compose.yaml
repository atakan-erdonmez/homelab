services:

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - /opt/services/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/services/monitoring/prometheus/data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped

    ports:
      - "3100:3000"

    volumes:
      - /opt/services/monitoring/grafana/data:/var/lib/grafana