---
- name: Deploy gatus on DebianDocker
  hosts: debiandocker
  become: true

  vars:
    base_dir: "/opt/services/gatus"
    nfs_server: "192.168.10.103"
    nfs_path: "/services/gatus"
    mount_point: "/mnt/services/<service>"
    restic_password: "{{ gatus_restic_backup_pw }}"

  vars_files:
  - "group_vars/all/secrets.yaml"

  tasks:
    - name: Ensure base directory exists
      ansible.builtin.file:
        path: "{{ base_dir }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0750"

    - name: Ensure config directory exists
      ansible.builtin.file:
        path: "{{ base_dir }}/config"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0750"

    - name: Copy compose file
      ansible.builtin.copy:
        src: compose.yaml
        dest: "{{ base_dir }}/compose.yaml"
        owner: "1000"
        group: "1000"
        mode: "0640"

    - name: Generate & copy .env file
      ansible.builtin.template:
        src: .env.j2
        dest: "{{ base_dir }}/.env"
        owner: "1000"
        group: "1000"
        mode: "0600" # Industry standard for protecting secrets on disk


    - name: Generate & copy config file
      ansible.builtin.template:
        src: config.yaml.j2
        dest: "{{ base_dir }}/config/config.yaml"
        owner: "1000"
        group: "1000"
        mode: "0600" # Industry standard for protecting secrets on disk

  
    - name: Deploy stack
      community.docker.docker_compose_v2:
        project_src: "{{ base_dir }}"
        state: present
        pull: always

    - name: Configure restic backup for gatus
      ansible.builtin.include_role:
        name: restic_backup